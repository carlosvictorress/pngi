<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBI — Setup Concluído</title>
    <link rel="icon" type="image/jpeg" href="/static/img/logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center font-sans antialiased p-4">
    <div class="max-w-md w-full bg-white border border-slate-200/90 rounded-2xl p-8 shadow-sm text-center space-y-5">
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 border border-emerald-200/80 text-emerald-600 flex items-center justify-center mx-auto">
            <i data-lucide="check-circle-2" class="w-6 h-6"></i>
        </div>
        <div class="space-y-1">
            <h2 class="text-lg font-bold text-slate-900">Ecossistema Mestre Ativo</h2>
            <p class="text-xs text-slate-500 leading-relaxed">O usuário administrador global já se encontra configurado e pronto para operação na base de dados.</p>
        </div>
        <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-4 text-left font-mono text-xs space-y-1.5 text-slate-700">
            <p><span class="text-slate-400">E-mail:</span> <strong>carlos@plataforma.com</strong></p>
            <p><span class="text-slate-400">Senha:</span> <strong>master123</strong></p>
        </div>
        <div class="pt-1">
            <a href="/auth/login-admin-global" class="inline-flex w-full items-center justify-center gap-2 text-xs font-semibold text-white bg-[#0084CE] hover:bg-[#006DAE] py-3 rounded-xl transition-all shadow-xs">
                <span>Ir para o Login do Administrador</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
