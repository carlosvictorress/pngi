<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBI — Autenticação da Infraestrutura Mestre</title>
    <link rel="icon" type="image/jpeg" href="/static/img/logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
                    },
                    colors: {
                        orbi: {
                            navy: '#0A2540',
                            blue: '#0084CE',
                            'blue-hover': '#006DAE'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F8FAFC] text-slate-900 min-h-screen flex flex-col justify-between font-sans antialiased p-4">

    <div class="w-full max-w-6xl mx-auto pt-4 flex items-center justify-between">
        <a href="/" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-500 hover:text-slate-900 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Voltar ao Portal ORBI</span>
        </a>
        <span class="text-[11px] font-medium text-slate-400">Ambiente de Controle Multitenant</span>
    </div>

    <main class="flex-grow flex items-center justify-center py-8">
        <div class="max-w-[400px] w-full bg-white border border-slate-200/90 rounded-2xl p-8 shadow-sm space-y-6">
            
            <div class="space-y-3 text-center">
                <div class="w-14 h-14 bg-slate-50 border border-slate-200/80 rounded-2xl p-2 flex items-center justify-center mx-auto shadow-xs">
                    <img src="/static/img/logo.jpeg" alt="ORBI" class="w-full h-full object-contain rounded-lg">
                </div>
                <div>
                    <span class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-700 text-[10px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full mb-2">
                        <i data-lucide="shield-lock" class="w-3 h-3 text-orbi-blue"></i>
                        <span>Torre de Controle Global</span>
                    </span>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900">Infraestrutura Mestre</h1>
                    <p class="text-xs text-slate-500 mt-0.5">Acesso restrito ao administrador global do ecossistema.</p>
                </div>
            </div>

            {% if erro %}
            <div class="bg-rose-50 border border-rose-200 text-rose-700 p-3.5 rounded-xl text-xs font-medium flex items-center gap-2.5">
                <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600 shrink-0"></i>
                <span>{{ erro }}</span>
            </div>
            {% endif %}

            <form method="POST" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">E-mail de Autenticação</label>
                    <div class="relative">
                        <input type="email" name="email" required placeholder="carlos@plataforma.com" class="w-full bg-white border border-slate-300 rounded-xl pl-10 pr-3.5 py-2.5 text-xs font-medium text-slate-900 placeholder:text-slate-400 focus:border-orbi-blue focus:ring-2 focus:ring-orbi-blue/15 focus:outline-none transition-all">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3 pointer-events-none"></i>
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">Chave de Segurança</label>
                    <div class="relative">
                        <input type="password" name="senha" required placeholder="••••••••" class="w-full bg-white border border-slate-300 rounded-xl pl-10 pr-3.5 py-2.5 text-xs font-medium text-slate-900 placeholder:text-slate-400 focus:border-orbi-blue focus:ring-2 focus:ring-orbi-blue/15 focus:outline-none transition-all">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3 pointer-events-none"></i>
                    </div>
                </div>
                <button type="submit" class="w-full bg-orbi-navy hover:bg-slate-800 text-white font-semibold py-3 rounded-xl text-xs transition-all shadow-sm flex items-center justify-center gap-2">
                    <span>Acessar Painel Central</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </main>

    <footer class="text-center pb-4 text-[11px] text-slate-400">
        ORBI — Governança da Educação Especial © 2026
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
