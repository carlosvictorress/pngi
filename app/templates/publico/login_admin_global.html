<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infraestrutura Mestre — Autenticação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif']
                    },
                    colors: {
                        apple: {
                            blue: '#0066cc',
                            dark: '#1d1d1f',
                            light: '#86868b',
                            gray: '#f5f5f7',
                            border: '#e8e8ed'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-apple-gray text-apple-dark min-h-screen flex items-center justify-center font-sans antialiased p-4">

    <div class="max-w-sm w-full bg-white border border-apple-border rounded-2xl p-8 shadow-sm space-y-6">
        <div class="space-y-1 text-center">
            <div class="w-8 h-8 bg-apple-dark text-white rounded-lg flex items-center justify-center font-bold text-sm mx-auto mb-2">Ω</div>
            <h2 class="text-lg font-medium tracking-tight text-apple-dark">Infraestrutura Mestre</h2>
            <p class="text-xs text-apple-light">Acesso restrito ao administrador global do ecossistema.</p>
        </div>

        {% if erro %}
        <div class="bg-red-50 border border-red-100 text-red-600 p-3 rounded-xl text-xs font-medium text-center">
            {{ erro }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div class="space-y-1">
                <label class="block text-xs font-medium text-apple-dark">E-mail de Autenticação</label>
                <input type="email" name="email" required placeholder="carlos@plataforma.com" class="w-full bg-apple-gray border border-transparent rounded-xl p-3 text-xs font-medium focus:bg-white focus:border-apple-blue focus:outline-none transition-all">
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-medium text-apple-dark">Chave de Segurança</label>
                <input type="password" name="senha" required placeholder="••••••••" class="w-full bg-apple-gray border border-transparent rounded-xl p-3 text-xs font-medium focus:bg-white focus:border-apple-blue focus:outline-none transition-all">
            </div>
            <button type="submit" class="w-full bg-apple-blue hover:bg-blue-600 text-white font-medium py-3 rounded-xl text-xs transition-all shadow-sm">
                Acessar Painel Central
            </button>
        </form>
    </div>

</body>
</html>
